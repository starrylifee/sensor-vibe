<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외계인 슈팅 게임</title>
<style>
  :root{--bg:#050a14;--panel:#081627;--border:rgba(0,255,180,.32);--accent:#00ffb4;--success:#00ff88;--muted:#7ae;--text:#dff;}
  body.hc{--bg:#000;--panel:#111;--border:#fff;--text:#fff;--muted:#ddd;}
  body.hc #canvas{filter:contrast(1.25) brightness(1.18);}
  body.hc #settPanel{background:#111;border-color:#fff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--text);height:100vh;
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;
  }
  #topbar{
    width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);
    gap:10px;flex-shrink:0;
  }
  #topbar a{color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:700;white-space:nowrap;}
  #topbar a:hover{color:var(--accent);}
  #ui{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
  .badge{
    background:rgba(0,255,180,.1);border:1px solid var(--border);color:var(--accent);
    padding:5px 10px;border-radius:6px;font-size:.8rem;font-weight:700;white-space:nowrap;
  }
  .badge span{color:#fff;}
  #lives-disp{color:#ff6680;}
  button.ctrl{
    background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:4px 8px;font-size:.72rem;cursor:pointer;white-space:nowrap;
  }
  button.ctrl:hover{border-color:var(--accent);color:var(--accent);}
  button.ctrl.connected{border-color:var(--success);color:var(--success);}
  #gameWrap{position:relative;flex:1;width:100%;max-width:720px;overflow:hidden;}
  #canvas{display:block;width:100%;height:100%;background:#050a14;}
  #sensorBar{
    width:100%;max-width:720px;background:var(--panel);border-top:1px solid var(--border);
    padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  #sensorBar .label{font-size:.7rem;color:var(--muted);white-space:nowrap;}
  #sensorMeter{flex:1;height:8px;background:rgba(0,255,180,.14);border-radius:4px;overflow:hidden;}
  #sensorFill{height:100%;background:var(--accent);border-radius:4px;transition:width .05s,background .1s;width:100%;}
  #sensorVal{font-size:.75rem;font-family:monospace;color:var(--accent);min-width:40px;text-align:right;}
  #overlay{
    position:absolute;inset:0;background:rgba(5,10,20,.92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;z-index:10;
  }
  #overlay h1{font-size:2.4rem;color:var(--accent);letter-spacing:.06em;}
  #overlay p{color:#aee;font-size:1.1rem;max-width:460px;text-align:center;line-height:1.7;}
  #overlay .sub{color:var(--muted);font-size:.95rem;}
  .btn{
    margin-top:10px;padding:11px 30px;border-radius:8px;border:none;cursor:pointer;
    font-size:.95rem;font-weight:800;background:var(--accent);color:#050a14;
    box-shadow:0 0 18px #00ffb455;transition:opacity .15s;min-width:140px;
  }
  .btn:hover{opacity:.85;}
  #settPanel{
    position:absolute;top:0;right:0;bottom:0;width:min(300px,100%);
    background:var(--panel);border-left:1px solid var(--border);z-index:20;
    padding:20px;overflow-y:auto;transform:translateX(100%);transition:transform .3s;
  }
  #settPanel.open{transform:translateX(0);}
  #settPanel h3{color:var(--accent);margin-bottom:18px;font-size:1rem;}
  .testbox{background:rgba(0,255,180,.08);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;text-align:center;}
  .testbox .bigv{font-size:2.2rem;font-weight:900;font-family:monospace;color:var(--accent);line-height:1;}
  .testbox .hint{font-size:.72rem;color:var(--muted);margin-top:4px;}
  .fire-ind{display:none;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.75rem;margin-top:8px;
    background:rgba(0,255,180,.12);border:1px solid var(--border);color:var(--accent);}
  .fire-ind.show{display:inline-flex;}
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html">← 목록</a>
  <div id="ui">
    <div class="badge">라운드 <span id="disp-round">1</span>/5</div>
    <div class="badge">격추 <span id="disp-score">0</span></div>
    <div class="badge" id="lives-disp">❤️ <span id="disp-lives">3</span></div>
    <div class="badge">최고 <span id="disp-hi">—</span></div>
  </div>
  <div style="display:flex;gap:4px">
    <button class="ctrl" id="hcToggle" onclick="toggleHC()">☀️</button>
    <button class="ctrl" id="settBtn">⚙️</button>
  </div>
</div>

<div id="gameWrap">
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <h1>👽 외계인 슈팅</h1>
    <p>밝기 센서를 <strong>가리면</strong> 총알이 발사돼요!<br>
       총구는 자동으로 위아래 움직여요.<br>
       외계인이 오른쪽에 닿으면 목숨을 잃어요.</p>
    <p class="sub">5라운드를 모두 클리어하세요!</p>
    <button class="btn" id="start-btn">시작하기</button>
  </div>
</div>

<div id="sensorBar">
  <span class="label">밝기</span>
  <div id="sensorMeter"><div id="sensorFill"></div></div>
  <span id="sensorVal">--</span>
  <button class="ctrl" id="serial-btn">🔌 연결</button>
</div>

<div id="settPanel">
  <h3>⚙️ 센서 · 입력 설정</h3>
  <div class="testbox">
    <div class="bigv" id="tBigV">--</div>
    <div class="hint">현재 밝기 센서 값 (0~1023)</div>
    <div style="height:10px;background:rgba(0,255,180,.14);border-radius:5px;overflow:hidden;margin-top:8px">
      <div id="tBar" style="height:100%;background:var(--accent);border-radius:5px;transition:width .05s;width:100%"></div>
    </div>
    <div class="fire-ind" id="fireInd">🔫 발사 신호</div>
  </div>
  <div style="font-size:.72rem;color:var(--muted);line-height:1.55;margin-bottom:16px">
    밝기 값이 300보다 낮아지면 발사합니다. 손으로 센서를 가렸다가 밝히며 반응을 확인하세요.
  </div>
  <button class="btn" id="closeSett" style="width:100%">닫기</button>
</div>

<script src="js/serial.js"></script>
<script src="js/keyboard-lock.js"></script>
<script>
let hcMode = localStorage.getItem('hc_mode') === '1';
function applyHC() {
  document.body.classList.toggle('hc', hcMode);
  const btn = document.getElementById('hcToggle');
  if (btn) btn.textContent = hcMode ? '🌙' : '☀️';
}
function toggleHC() {
  hcMode = !hcMode;
  localStorage.setItem('hc_mode', hcMode ? '1' : '0');
  applyHC();
}
applyHC();

// ── canvas setup ──────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = 720, H = 480;
canvas.width = W; canvas.height = H;

// ── serial ────────────────────────────────────────────────────
const sm = new SerialManager();
let sensorVal = 1023;
let connected = false;
sm.onData(v => {
  sensorVal = v;
  updateSensorUI(v);
});
sm.onConnect(() => {
  connected = true;
  document.getElementById('serial-btn').textContent = '🔴 연결됨';
  document.getElementById('serial-btn').classList.add('connected');
});
sm.onDisconnect(() => {
  connected = false;
  sensorVal = 1023;
  updateSensorUI(sensorVal);
  document.getElementById('serial-btn').textContent = '🔌 연결';
  document.getElementById('serial-btn').classList.remove('connected');
});
document.getElementById('serial-btn').addEventListener('click', async () => {
  if (sm.active) await sm.disconnect();
  else try { await sm.connect(); } catch (e) { alert(e.message); }
});

// ── constants ─────────────────────────────────────────────────
const THRESHOLD   = 300;
const GUN_X       = W - 60;
const GUN_MARGIN  = 34;
const GUN_SWEEP_H = H - GUN_MARGIN * 2;
const GUN_CY      = H * 0.5;
const BULLET_SPEED= 9;
const ALIEN_SPEEDS = [1.2, 1.6, 2.0, 2.5, 3.1];  // per round
const ROUND_ALIENS = [10, 20, 30, 40, 50];
const FIRE_INTERVAL= 10; // frames between bullets when firing

function updateSensorUI(v) {
  const pct = Math.max(0, Math.min(100, (v / 1023) * 100));
  const firing = v < THRESHOLD;
  document.getElementById('sensorFill').style.width = pct + '%';
  document.getElementById('sensorFill').style.background = firing ? '#ff4466' : '#00ffb4';
  document.getElementById('sensorVal').textContent = Math.round(v);
  document.getElementById('tBigV').textContent = Math.round(v);
  document.getElementById('tBar').style.width = pct + '%';
  document.getElementById('tBar').style.background = firing ? '#ff4466' : '#00ffb4';
  document.getElementById('fireInd').classList.toggle('show', firing);
}
updateSensorUI(sensorVal);

// ── state ─────────────────────────────────────────────────────
let state = 'title'; // title | play | win | lose
let round, lives, score, hiScore;
let gunY, gunT;
let bullets, aliens, alienQueue;
let spawnTimer, fireCooldown;
let prevCovered, frame;
let fireKeyHeld = false;

function loadHi() {
  hiScore = +localStorage.getItem('alienshoot_hi') || 0;
  const d = document.getElementById('disp-hi');
  d.textContent = hiScore > 0 ? hiScore + '격추' : '—';
}
loadHi();

function saveHi() {
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('alienshoot_hi', hiScore);
    loadHi();
  }
}

// ── init ──────────────────────────────────────────────────────
function initGame() {
  round = 1; lives = 3; score = 0;
  gunY  = GUN_CY; gunT = 0;
  bullets = []; aliens = [];
  buildQueue();
  spawnTimer  = 0;
  fireCooldown = 0;
  prevCovered  = false;
  frame        = 0;
  fireKeyHeld  = false;
  updateUI();
}

function buildQueue() {
  alienQueue = ROUND_ALIENS[round - 1];
}

function updateUI() {
  document.getElementById('disp-round').textContent = round;
  document.getElementById('disp-score').textContent = score;
  document.getElementById('disp-lives').textContent = lives;
}

// ── alien factory ─────────────────────────────────────────────
function spawnAlien() {
  if (alienQueue <= 0) return;
  alienQueue--;
  const size = 28 + Math.random() * 16;
  aliens.push({
    x: -size,
    y: H * 0.1 + Math.random() * H * 0.78,
    size,
    spd: ALIEN_SPEEDS[round - 1] * (0.85 + Math.random() * 0.35),
    hp: round >= 4 ? 2 : 1,
    hit: 0,   // flash timer
    color: `hsl(${80 + Math.round(Math.random()*120)},90%,55%)`
  });
}

// ── drawing helpers ───────────────────────────────────────────
function drawStars(fr) {
  ctx.save();
  for (let i = 0; i < 80; i++) {
    const sx = ((i * 173 + fr * 0.15) % W);
    const sy = (i * 97 + i * 53) % H;
    const r  = 0.5 + (i % 3) * 0.6;
    const a  = 0.4 + 0.6 * Math.abs(Math.sin(fr * 0.02 + i));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPlanets() {
  // small planet top-left
  ctx.save();
  ctx.globalAlpha = 0.25;
  const g1 = ctx.createRadialGradient(90, 70, 0, 90, 70, 55);
  g1.addColorStop(0, '#4488ff');
  g1.addColorStop(1, '#0011aa');
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(90, 70, 55, 0, Math.PI*2); ctx.fill();
  // ring
  ctx.strokeStyle = '#6699ff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(90, 70, 80, 14, -0.35, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawGun(gy) {
  const x = GUN_X;
  ctx.save();
  ctx.translate(x, gy);

  // body
  const bg = ctx.createLinearGradient(-18, -14, 18, 14);
  bg.addColorStop(0, '#aaddff');
  bg.addColorStop(1, '#2255aa');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(-18, -14, 36, 28, 6);
  ctx.fill();

  // barrel pointing left
  ctx.fillStyle = '#88ccff';
  ctx.fillRect(-46, -5, 30, 10);

  // glow at barrel tip
  const glow = ctx.createRadialGradient(-47, 0, 0, -47, 0, 14);
  glow.addColorStop(0, 'rgba(0,255,255,0.8)');
  glow.addColorStop(1, 'rgba(0,255,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(-47, 0, 14, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#00ffff';
  ctx.beginPath(); ctx.ellipse(b.x, b.y, 10, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawAlien(a) {
  ctx.save();
  ctx.translate(a.x, a.y);

  if (a.hit > 0) {
    ctx.globalAlpha = 0.4 + 0.6 * ((a.hit % 4) < 2 ? 1 : 0);
  }

  const r = a.size / 2;

  // body (ellipse)
  ctx.fillStyle = a.color;
  ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.9, r * 0.7, 0, 0, Math.PI*2); ctx.fill();

  // head (circle)
  ctx.fillStyle = a.color;
  ctx.beginPath(); ctx.arc(0, -r * 0.35, r * 0.65, 0, Math.PI*2); ctx.fill();

  // eyes
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(-r*0.25, -r*0.4, r*0.18, r*0.22, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r*0.25, -r*0.4, r*0.18, r*0.22,  0.2, 0, Math.PI*2); ctx.fill();
  // pupils
  ctx.fillStyle = '#ff0';
  ctx.beginPath(); ctx.arc(-r*0.25, -r*0.4, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.25, -r*0.4, r*0.08, 0, Math.PI*2); ctx.fill();

  // antennae
  ctx.strokeStyle = a.color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-r*0.3, -r); ctx.lineTo(-r*0.5, -r*1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( r*0.3, -r); ctx.lineTo( r*0.5, -r*1.5); ctx.stroke();
  // tip dots
  ctx.fillStyle = '#ff55ff';
  ctx.beginPath(); ctx.arc(-r*0.5, -r*1.5, r*0.14, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.5, -r*1.5, r*0.14, 0, Math.PI*2); ctx.fill();

  // legs
  ctx.strokeStyle = a.color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-r*0.4, r); ctx.lineTo(-r*0.6, r*1.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( r*0.4, r); ctx.lineTo( r*0.6, r*1.6); ctx.stroke();

  // hp bar for 2-hp aliens
  if (a.hp === 2) {
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#300';
    ctx.fillRect(-r*0.8, -r*1.8, r*1.6, 6);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(-r*0.8, -r*1.8, r*1.6, 6);
  }

  ctx.restore();
}

// ── round / win / lose overlays ───────────────────────────────
function showOverlay(title, body, btnLabel) {
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1>${title}</h1>
    <p>${body}</p>
    <button class="btn" id="ov-btn">${btnLabel}</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('ov-btn').addEventListener('click', () => {
    ov.style.display = 'none';
    if (state === 'win' || state === 'lose') {
      initGame();
      state = 'play';
    } else if (state === 'nextround') {
      round++;
      buildQueue();
      aliens = []; bullets = [];
      spawnTimer = 0;
      state = 'play';
      updateUI();
    }
  });
}

// ── main loop ─────────────────────────────────────────────────
let raf;
function loop() {
  raf = requestAnimationFrame(loop);
  frame++;

  // ── background ─────────────────────
  ctx.fillStyle = '#050a14';
  ctx.fillRect(0, 0, W, H);
  drawStars(frame);
  drawPlanets();

  // right wall danger zone
  ctx.fillStyle = 'rgba(255,50,50,0.06)';
  ctx.fillRect(GUN_X - 10, 0, W - GUN_X + 10, H);
  ctx.strokeStyle = 'rgba(255,80,80,0.25)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(GUN_X - 10, 0); ctx.lineTo(GUN_X - 10, H); ctx.stroke();
  ctx.setLineDash([]);

  if (state !== 'play') {
    drawGun(gunY);
    return;
  }

  // ── sensor ─────────────────────────
  const covered = sensorVal < THRESHOLD;
  const isFiring = covered;

  // keyboard fallback
  const kFire = fireKeyHeld;

  // ── gun sweep ──────────────────────
  gunT += 0.035;
  gunY = GUN_CY + Math.sin(gunT) * GUN_SWEEP_H * 0.5;
  gunY = Math.max(GUN_MARGIN, Math.min(H - GUN_MARGIN, gunY));

  // ── fire bullets ───────────────────
  if (isFiring || kFire) {
    if (fireCooldown <= 0) {
      bullets.push({ x: GUN_X - 48, y: gunY });
      fireCooldown = FIRE_INTERVAL;
    }
  }
  if (fireCooldown > 0) fireCooldown--;

  // ── spawn aliens ───────────────────
  if (alienQueue > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnAlien();
      // spacing decreases each round
      spawnTimer = Math.max(28, 80 - round * 12);
    }
  }

  // ── move bullets ───────────────────
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x -= BULLET_SPEED;
    if (bullets[i].x < -20) bullets.splice(i, 1);
  }

  // ── move aliens ────────────────────
  for (let i = aliens.length - 1; i >= 0; i--) {
    const a = aliens[i];
    a.x += a.spd;
    if (a.hit > 0) a.hit--;

    // reached right wall
    if (a.x > GUN_X - 10) {
      aliens.splice(i, 1);
      lives--;
      updateUI();
      if (lives <= 0) {
        state = 'lose';
        saveHi();
        showOverlay('💀 게임 오버', `${score}마리 격추! 최고기록: ${hiScore}격추<br>다시 도전해볼까요?`, '다시 시작');
      }
      continue;
    }

    // bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < (a.size * 0.85) ** 2) {
        bullets.splice(j, 1);
        a.hp--;
        a.hit = 8;
        if (a.hp <= 0) {
          aliens.splice(i, 1);
          score++;
          updateUI();
          break;
        }
      }
    }
  }

  // ── round clear check ─────────────
  if (alienQueue <= 0 && aliens.length === 0 && state === 'play') {
    if (round >= 5) {
      state = 'win';
      saveHi();
      showOverlay('🎉 게임 클리어!', `5라운드 완전 클리어!<br>${score}마리 격추! 대단해요! 👽🔫`, '처음부터');
    } else {
      state = 'nextround';
      showOverlay(`✅ 라운드 ${round} 클리어!`, `${score}마리 격추 중!<br>라운드 ${round + 1}을 준비하세요!`, `라운드 ${round + 1} 시작`);
    }
  }

  // ── draw ───────────────────────────
  bullets.forEach(drawBullet);
  aliens.forEach(drawAlien);
  drawGun(gunY);

  // firing indicator
  if (isFiring || kFire) {
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.1 * Math.sin(frame * 0.4);
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔥 발사 중!', GUN_X, H - 16);
    ctx.restore();
  }

  // round progress bar
  const total = ROUND_ALIENS[round - 1];
  const remaining = aliens.length + alienQueue;
  const pct = Math.max(0, 1 - remaining / total);
  ctx.fillStyle = 'rgba(0,255,180,0.12)';
  ctx.fillRect(10, H - 12, W - 20, 6);
  ctx.fillStyle = '#00ffb4';
  ctx.fillRect(10, H - 12, (W - 20) * pct, 6);

  prevCovered = covered;
}

// ── keyboard ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (['Space','KeyZ','KeyX','ControlLeft','ControlRight'].includes(e.code)) {
    fireKeyHeld = true;
  }
});
document.addEventListener('keyup', e => {
  if (['Space','KeyZ','KeyX','ControlLeft','ControlRight'].includes(e.code)) {
    fireKeyHeld = false;
  }
});

// Touch should not replace the sensor shooting action in this game.

// ── start button ──────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  initGame();
  state = 'play';
  loop();
});

document.getElementById('settBtn').addEventListener('click', () => {
  document.getElementById('settPanel').classList.toggle('open');
});
document.getElementById('closeSett').addEventListener('click', () => {
  document.getElementById('settPanel').classList.remove('open');
});

// draw title screen
(function titleDraw() {
  ctx.fillStyle = '#050a14';
  ctx.fillRect(0, 0, W, H);
  drawStars(0);
  drawPlanets();
  drawGun(GUN_CY);
})();
</script>
</body>
</html>
