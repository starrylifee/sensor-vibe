<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이스크림 가게에 어서오세요! — EZMaker</title>
<style>
  :root{--bg:#f0fdf9;--panel:#fff;--border:#d1fae5;--accent:#e91e8c;--success:#10b981;--muted:#6b7280;--text:#1f2937;}
  body.hc{--bg:#000;--panel:#111;--border:#fff;--text:#fff;--muted:#ddd;}
  body.hc .overlay{background:rgba(0,0,0,.95)!important;}
  body.hc #settPanel{background:#111;border-color:#fff;}
  body.hc .srow select{background:#222;color:#fff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
    height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;}
  #topbar{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);gap:8px;flex-shrink:0;}
  #topbar a{color:var(--muted);text-decoration:none;font-size:.8rem;}
  #topbar a:hover{color:var(--accent);}
  .stat{text-align:center;}
  .stat .label{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .stat .value{font-size:1.05rem;font-weight:700;color:var(--accent);font-family:monospace;}
  #gameWrap{position:relative;flex:1;width:100%;max-width:560px;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #sensorBar{width:100%;max-width:560px;background:var(--panel);border-top:1px solid var(--border);
    padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  #sensorBar .label{font-size:.7rem;color:var(--muted);white-space:nowrap;}
  #sensorMeter{flex:1;height:8px;background:#d1fae5;border-radius:4px;overflow:hidden;}
  #sensorFill{height:100%;background:var(--accent);border-radius:4px;transition:width .05s;width:0%;}
  #sensorVal{font-size:.75rem;font-family:monospace;color:var(--accent);min-width:40px;text-align:right;}
  button.ctrl{background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:4px 8px;font-size:.72rem;cursor:pointer;white-space:nowrap;}
  button.ctrl:hover{border-color:var(--accent);color:var(--accent);}
  button.ctrl.connected{border-color:var(--success);color:var(--success);}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.92);z-index:10;flex-direction:column;gap:12px;padding:24px;}
  .overlay.hidden{display:none;}
  .overlay h2{font-size:1.4rem;font-weight:800;color:var(--accent);text-align:center;line-height:1.3;}
  .overlay .sub{color:var(--muted);font-size:.83rem;text-align:center;line-height:1.8;max-width:300px;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:11px 30px;font-size:.95rem;font-weight:700;cursor:pointer;}
  .btn:hover{opacity:.85;}
  #settPanel{position:absolute;top:0;right:0;bottom:0;width:min(280px,100%);
    background:var(--panel);border-left:1px solid var(--border);z-index:20;padding:20px;overflow-y:auto;
    transform:translateX(100%);transition:transform .3s;}
  #settPanel.open{transform:translateX(0);}
  #settPanel h3{color:var(--accent);margin-bottom:18px;font-size:1rem;}
  .srow{margin-bottom:16px;}
  .srow label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;}
  .srow input[type=range]{width:100%;accent-color:var(--accent);}
  .srow select{width:100%;background:#f9fafb;border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 10px;}
  .testbox{background:#f9fafb;border:1px solid var(--border);border-radius:8px;
    padding:14px;margin-bottom:16px;text-align:center;}
  .testbox .bigv{font-size:2.5rem;font-weight:900;font-family:monospace;color:var(--accent);line-height:1;}
  .testbox .hint{font-size:.72rem;color:var(--muted);margin-top:4px;}
  .drop-ind{display:none;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
    font-size:.75rem;margin-top:8px;background:rgba(233,30,140,.12);
    border:1px solid rgba(233,30,140,.4);color:var(--accent);}
  .drop-ind.show{display:inline-flex;}
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html">← 목록</a>
  <div style="display:flex;gap:16px;align-items:center">
    <div class="stat"><div class="label">점수</div><div class="value" id="scoreDisp">0</div></div>
    <div class="stat"><div class="label">최고</div><div class="value" id="hiDisp">0</div></div>
    <div class="stat"><div class="label">남은 기회</div><div class="value" id="livesDisp">❤️❤️❤️</div></div>
  </div>
  <div style="display:flex;gap:4px">
    <button class="ctrl" id="hcToggle" onclick="toggleHC()">☀️</button>
    <button class="ctrl" id="settBtn">⚙️</button>
  </div>
</div>

<div id="gameWrap">
  <canvas id="gc"></canvas>

  <div class="overlay" id="startPanel">
    <div style="font-size:2.8rem">🍦</div>
    <h2>아이스크림 가게에<br>어서오세요!</h2>
    <div class="sub">
      밝기 센서를 손으로 <strong style="color:var(--accent)">가리는 순간</strong><br>
      아이스크림 스쿱이 떨어져요!<br>
      콘 위에 정확히 올리세요 🎯<br>
      3번 놓치면 게임 오버!<br>
      <span style="font-size:.72rem;opacity:.6">키보드 Space · ↓ 로도 가능</span>
    </div>
    <button class="btn" id="startBtn">시작! 🍦</button>
  </div>

  <div class="overlay hidden" id="overPanel">
    <div style="font-size:2.4rem">😢</div>
    <h2>아이스크림을<br>3번 흘렸어요...</h2>
    <div style="font-size:2.2rem;font-weight:900;color:var(--accent);margin:4px 0" id="finalDisp">0개</div>
    <div class="sub">냠냠한 아이스크림을 잡았어요!</div>
    <button class="btn" id="restartBtn">다시 도전 🍦</button>
    <a href="index.html" style="color:var(--muted);font-size:.8rem;margin-top:6px">← 목록으로</a>
  </div>
</div>

<div id="sensorBar">
  <span class="label">밝기</span>
  <div id="sensorMeter"><div id="sensorFill"></div></div>
  <span id="sensorVal">—</span>
  <button class="ctrl" id="connectBtn">🔌 연결</button>
</div>

<div id="settPanel">
  <h3>⚙️ 센서 · 입력 설정</h3>
  <div class="testbox">
    <div class="bigv" id="tBigV">—</div>
    <div class="hint">현재 밝기 센서 값 (0~1023)</div>
    <div style="height:10px;background:#d1fae5;border-radius:5px;overflow:hidden;margin-top:8px">
      <div id="tBar" style="height:100%;background:var(--accent);border-radius:5px;transition:width .05s;width:0%"></div>
    </div>
    <div class="drop-ind" id="dropInd">🍦 떨어뜨리기!</div>
  </div>
  <div class="srow">
    <label>입력 모드: <strong id="inputModeLabel">둘 다</strong></label>
    <select id="inputModeSelect">
      <option value="both">센서 + 키보드 둘 다</option>
      <option value="sensor">센서만 사용</option>
      <option value="keyboard">키보드만 사용</option>
    </select>
  </div>
  <div class="srow">
    <label>떨어뜨리기 임계값: <strong id="thrLabel">300</strong></label>
    <input type="range" id="thrSlider" min="0" max="1023" value="300">
    <div style="font-size:.72rem;color:var(--muted);margin-top:6px">
      센서 값이 이 값보다 낮으면 스쿱이 떨어집니다.
    </div>
  </div>
  <button class="btn" id="closeSett" style="width:100%">닫기</button>
</div>

<script src="js/serial.js"></script>
<script>
// ── 고대비 ────────────────────────────────────
let hcMode = localStorage.getItem('hc_mode') === '1';
function applyHC() {
  document.body.classList.toggle('hc', hcMode);
  document.getElementById('hcToggle').textContent = hcMode ? '🌙' : '☀️';
}
function toggleHC() { hcMode = !hcMode; localStorage.setItem('hc_mode', hcMode ? '1' : '0'); applyHC(); }
applyHC();

// ── Canvas ────────────────────────────────────
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('gameWrap');
function resize() { canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight; }
resize(); window.addEventListener('resize', resize);

// ── Serial ────────────────────────────────────
const serial = new SerialManager();
let sensorVal = 1023;
serial.onData(v => {
  sensorVal = v;
  const pct = (v / 1023) * 100;
  const act = v < cfg.threshold;
  document.getElementById('sensorFill').style.width      = pct + '%';
  document.getElementById('sensorFill').style.background = act ? '#e91e8c' : '#10b981';
  document.getElementById('sensorVal').textContent       = Math.round(v);
  document.getElementById('tBigV').textContent           = Math.round(v);
  document.getElementById('tBar').style.width            = pct + '%';
  document.getElementById('dropInd').classList.toggle('show', act);
});
serial.onConnect(() => {
  document.getElementById('connectBtn').textContent = '🔴 연결됨';
  document.getElementById('connectBtn').classList.add('connected');
});
serial.onDisconnect(() => {
  document.getElementById('connectBtn').textContent = '🔌 연결';
  document.getElementById('connectBtn').classList.remove('connected');
  sensorVal = 1023;
});

// ── Config ────────────────────────────────────
const cfg = { threshold: 300, inputMode: 'both' };
const LB_KEY = 'icecream_hi';
function getHi() { return +localStorage.getItem(LB_KEY) || 0; }
function saveHi(s) { if (s > getHi()) localStorage.setItem(LB_KEY, s); }

// ── Constants ─────────────────────────────────
const SCOOP_R    = 26;
const CONE_HW    = 34;  // half-width of cone opening
const CONE_H     = 78;
const SHELF_Y    = 58;  // y of dispenser shelf
const SCOOP_Y    = SHELF_Y + 34; // resting y of scoop (center)
const MAX_MISSES = 3;

const SCOOP_COLORS = [
  { fill:'#ff8fab', dark:'#e0607a' },  // strawberry
  { fill:'#ffd166', dark:'#e8a800' },  // vanilla
  { fill:'#b5a3e8', dark:'#7c66cc' },  // blueberry
  { fill:'#7de8c9', dark:'#3cbfa0' },  // mint
  { fill:'#d4a373', dark:'#a07040' },  // chocolate
  { fill:'#f4a261', dark:'#d07030' },  // orange sorbet
];

// ── State ─────────────────────────────────────
let state = 'menu';
let score = 0, misses = 0, frame = 0;
let oscT = 0;
let particles = [], textPops = [];
let prevCovered = false, dropKeyHeld = false;

const scoop = { x: 0, y: SCOOP_Y, vy: 0, state: 'moving', colorIdx: 0 };
const cone  = { x: 0, y: 0 };

// ── Init ──────────────────────────────────────
function initGame() {
  score = 0; misses = 0; frame = 0; oscT = 0;
  particles = []; textPops = [];
  scoop.state = 'moving'; scoop.colorIdx = 0;
  scoop.x = canvas.width / 2; scoop.y = SCOOP_Y; scoop.vy = 0;
  cone.x  = canvas.width / 2;
  cone.y  = canvas.height - 32 - CONE_H;
  prevCovered = false; dropKeyHeld = false;
  updateScoreUI(); updateLivesUI();
  document.getElementById('hiDisp').textContent = getHi();
}

// ── Update ────────────────────────────────────
function update() {
  if (state !== 'playing') return;
  frame++;

  // Input: edge-trigger on sensor cover or keypress
  const useS   = cfg.inputMode === 'sensor'   || cfg.inputMode === 'both';
  const useK   = cfg.inputMode === 'keyboard' || cfg.inputMode === 'both';
  const covered    = (useS && sensorVal < cfg.threshold) || (useK && dropKeyHeld);
  const justCovered = covered && !prevCovered;
  prevCovered = covered;
  dropKeyHeld = false;

  if (scoop.state === 'moving') {
    const spd = Math.min(0.022 + score * 0.003, 0.055);
    oscT += spd;
    scoop.x = canvas.width / 2 + Math.sin(oscT) * (canvas.width * 0.37);
    scoop.y = SCOOP_Y;

    if (justCovered) {
      scoop.state = 'falling';
      scoop.vy = 4 + score * 0.2;
    }
  } else if (scoop.state === 'falling') {
    scoop.vy = Math.min(scoop.vy + 0.38, 18);
    scoop.y += scoop.vy;

    if (scoop.y + SCOOP_R >= cone.y) {
      if (Math.abs(scoop.x - cone.x) <= CONE_HW + SCOOP_R * 0.5) {
        // Caught!
        score++;
        saveHi(score);
        updateScoreUI();
        document.getElementById('hiDisp').textContent = getHi();
        spawnCatchParticles(scoop.x, cone.y);
        textPops.push({ text: '+1!', x: scoop.x, y: cone.y - 20, alpha: 1, vy: -1.8, life: 45 });
        scoop.state = 'waiting';
        setTimeout(nextScoop, 650);
      } else if (scoop.y > canvas.height + 60) {
        // Missed
        misses++;
        updateLivesUI();
        spawnMissParticles(scoop.x, canvas.height - 40);
        textPops.push({ text: '아뿔싸!', x: scoop.x, y: canvas.height - 80, alpha: 1, vy: -1.5, life: 45 });
        scoop.state = 'waiting';
        if (misses >= MAX_MISSES) {
          setTimeout(() => {
            document.getElementById('finalDisp').textContent = score + '개';
            state = 'gameover';
            showPanel('overPanel');
          }, 700);
        } else {
          setTimeout(nextScoop, 650);
        }
      }
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.alpha -= 0.03; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Text pops
  for (const t of textPops) { t.y += t.vy; t.alpha -= 1 / t.life; t.life--; }
  textPops = textPops.filter(t => t.life > 0);
}

function nextScoop() {
  if (state !== 'playing') return;
  scoop.colorIdx = (scoop.colorIdx + 1) % SCOOP_COLORS.length;
  scoop.state = 'moving'; scoop.vy = 0;
}

// ── Particles ─────────────────────────────────
function spawnCatchParticles(x, y) {
  const cols = ['#ff8fab','#ffd166','#b5a3e8','#7de8c9','#f4a261','#fff'];
  for (let i = 0; i < 22; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 5.5;
    particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 3,
      alpha:1, r:3+Math.random()*6, life:30+Math.random()*20,
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
}
function spawnMissParticles(x, y) {
  for (let i = 0; i < 10; i++) {
    const ang = Math.PI + Math.random() * Math.PI;
    const spd = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 1,
      alpha:1, r:3+Math.random()*4, life:20+Math.random()*14, color:'#ef4444' });
  }
}

// ── Draw ──────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  if (state === 'menu') return;

  // Catch zone glow when scoop is directly above cone
  const inZone = scoop.state === 'moving' && Math.abs(scoop.x - cone.x) <= CONE_HW + SCOOP_R * 0.6;
  drawCone(cone.x, cone.y, inZone);

  // Arm from shelf to scoop (only when moving)
  if (scoop.state === 'moving') {
    ctx.save();
    ctx.strokeStyle = hcMode ? 'rgba(255,255,255,0.5)' : 'rgba(120,80,50,0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, SHELF_Y);
    ctx.lineTo(scoop.x, scoop.y - SCOOP_R);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  drawScoopShape(scoop.x, scoop.y, SCOOP_COLORS[scoop.colorIdx]);

  // Particles
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Text pops
  for (const t of textPops) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, t.alpha);
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e91e8c';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ── Background ────────────────────────────────
function drawBackground() {
  if (hcMode) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, SHELF_Y - 14, canvas.width, 14);
    return;
  }
  // Pastel gradient
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#e0f7fa');
  grad.addColorStop(0.45, '#fce4ec');
  grad.addColorStop(1, '#fff9c4');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Candy-stripe overlay
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 22;
  for (let x = -30; x < canvas.width + 30; x += 55) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 30, canvas.height); ctx.stroke();
  }
  ctx.restore();

  // Decorations
  if (!hcMode) {
    ctx.font = '16px serif'; ctx.fillStyle = 'rgba(255,150,180,0.35)';
    const decos = [['★',38,92],['★',canvas.width-44,80],['♥',25,canvas.height*0.42],
                   ['♥',canvas.width-36,canvas.height*0.42],['★',canvas.width*0.14,canvas.height*0.72],
                   ['★',canvas.width*0.83,canvas.height*0.72]];
    decos.forEach(([t,x,y]) => ctx.fillText(t,x,y));
  }

  // Shop shelf
  const sg = ctx.createLinearGradient(0, SHELF_Y-14, 0, SHELF_Y);
  sg.addColorStop(0,'#a1887f'); sg.addColorStop(1,'#795548');
  ctx.fillStyle = sg; ctx.fillRect(0, SHELF_Y-14, canvas.width, 14);
  ctx.fillStyle = '#8d6e63'; ctx.fillRect(0, SHELF_Y, canvas.width, 5);

  // Dispenser label at center
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e91e8c'; ctx.lineWidth = 2;
  const dw=88,dh=26,dx=canvas.width/2-dw/2,dy=SHELF_Y-14-dh;
  ctx.beginPath(); ctx.roundRect(dx,dy,dw,dh,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e91e8c'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🍦 아이스크림 가게', canvas.width/2, dy+dh/2+4);
  ctx.textAlign = 'left'; ctx.restore();

  // Floor
  const fg = ctx.createLinearGradient(0,canvas.height-30,0,canvas.height);
  fg.addColorStop(0,'#bcaaa4'); fg.addColorStop(1,'#a1887f');
  ctx.fillStyle = fg; ctx.fillRect(0, canvas.height-30, canvas.width, 30);
}

// ── Cone Draw ─────────────────────────────────
function drawCone(x, topY, highlight) {
  const hw = CONE_HW, h = CONE_H;
  ctx.save();

  // Catch zone glow
  if (highlight) {
    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(255,210,80,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, topY + 4, hw * 1.2, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Cone shadow
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.ellipse(x+4, topY+h+10, hw*0.55, 8, 0, 0, Math.PI*2); ctx.fill();

  // Main cone
  const cg = ctx.createLinearGradient(x-hw, topY, x+hw, topY+h);
  cg.addColorStop(0,'#f5c07a'); cg.addColorStop(0.5,'#e8923e'); cg.addColorStop(1,'#bf7722');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.moveTo(x-hw, topY); ctx.lineTo(x+hw, topY); ctx.lineTo(x, topY+h); ctx.closePath(); ctx.fill();

  // Waffle grid
  ctx.strokeStyle = 'rgba(80,40,0,0.22)'; ctx.lineWidth = 1.2;
  for (let i=1; i<=4; i++) {
    const t=i/5, lw=hw*(1-t), ly=topY+h*t;
    ctx.beginPath(); ctx.moveTo(x-lw,ly); ctx.lineTo(x+lw,ly); ctx.stroke();
  }
  for (let i=-2; i<=2; i++) {
    ctx.beginPath(); ctx.moveTo(x+i*hw/2.2,topY); ctx.lineTo(x,topY+h); ctx.stroke();
  }
  // Rim highlight
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-hw,topY); ctx.lineTo(x+hw,topY); ctx.stroke();
  ctx.restore();
}

// ── Scoop Draw ────────────────────────────────
function drawScoopShape(x, y, col) {
  const r = SCOOP_R;
  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  ctx.beginPath(); ctx.ellipse(x+3, y+4, r*0.9, r*0.7, 0, 0, Math.PI*2); ctx.fill();
  // Glow
  ctx.shadowColor = col.fill; ctx.shadowBlur = 16;
  ctx.fillStyle = col.fill;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // Highlight radial
  const hl = ctx.createRadialGradient(x-r*0.3, y-r*0.3, 0, x, y, r);
  hl.addColorStop(0, 'rgba(255,255,255,0.55)');
  hl.addColorStop(0.5, 'rgba(255,255,255,0.1)');
  hl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  // Sprinkles (slowly rotating for visual life)
  const sprCols = ['#ff3333','#33cc33','#3333ff','#ff33ff','#ffcc00'];
  for (let i=0; i<6; i++) {
    const ang = (i/6)*Math.PI*2 + frame*0.012;
    const d   = r * 0.47;
    const sx2 = x + Math.cos(ang)*d, sy2 = y + Math.sin(ang)*d;
    ctx.fillStyle = sprCols[i % sprCols.length];
    ctx.save(); ctx.translate(sx2,sy2); ctx.rotate(ang);
    ctx.fillRect(-5.5,-2,11,4); ctx.restore();
  }
  ctx.restore();
}

// ── Game Loop ─────────────────────────────────
function loop() { requestAnimationFrame(loop); update(); draw(); }
loop();

// ── UI ────────────────────────────────────────
function updateScoreUI() { document.getElementById('scoreDisp').textContent = score; }
function updateLivesUI() {
  document.getElementById('livesDisp').innerHTML =
    Array.from({length:MAX_MISSES}, (_,i) =>
      `<span style="opacity:${i < MAX_MISSES-misses ? 1 : 0.15}">❤️</span>`
    ).join('');
}
function showPanel(id) {
  ['startPanel','overPanel'].forEach(p =>
    document.getElementById(p).classList.toggle('hidden', p !== id));
}
function hideAllPanels() {
  ['startPanel','overPanel'].forEach(p => document.getElementById(p).classList.add('hidden'));
}

// ── Game Flow ─────────────────────────────────
function startGame() { initGame(); state = 'playing'; hideAllPanels(); }
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ── Input ─────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    e.preventDefault(); dropKeyHeld = true;
    if (state !== 'playing') startGame();
  }
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); dropKeyHeld = true;
  if (state !== 'playing') startGame();
});
canvas.addEventListener('pointerup', () => { dropKeyHeld = false; });

// ── Serial ────────────────────────────────────
document.getElementById('connectBtn').addEventListener('click', async () => {
  if (serial.active) await serial.disconnect();
  else try { await serial.connect(); } catch (e) { alert(e.message); }
});

// ── Settings ──────────────────────────────────
document.getElementById('settBtn').addEventListener('click', () =>
  document.getElementById('settPanel').classList.toggle('open'));
document.getElementById('closeSett').addEventListener('click', () =>
  document.getElementById('settPanel').classList.remove('open'));
document.getElementById('thrSlider').addEventListener('input', e => {
  cfg.threshold = +e.target.value;
  document.getElementById('thrLabel').textContent = cfg.threshold;
});
document.getElementById('inputModeSelect').addEventListener('change', e => {
  cfg.inputMode = e.target.value;
  document.getElementById('inputModeLabel').textContent =
    {sensor:'센서', keyboard:'키보드', both:'둘 다'}[cfg.inputMode];
});

document.getElementById('hiDisp').textContent = getHi();
updateLivesUI();
</script>
